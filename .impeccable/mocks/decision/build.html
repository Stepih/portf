<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Raleway:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#fff;color:#131313;font-family:Raleway,Arial,sans-serif;position:relative}
.glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6}
.g1{width:340px;height:340px;background:#ea7777;left:-60px;top:-40px}
.g2{width:340px;height:340px;background:#77c7ea;right:-80px;bottom:60px}
.top{text-align:center;padding-top:48px;position:relative}
.crumb{font-size:14px;color:rgba(19,19,19,.62);margin-bottom:14px}
h1{font-size:44px;font-weight:700}
.lead{font-size:19px;color:rgba(19,19,19,.62);margin-top:12px}
.row{position:relative;display:grid;grid-template-columns:150px 760px 300px;gap:40px;justify-content:center;margin-top:44px}
.win{background:rgba(57,57,57,.08);border-radius:13px;box-shadow:0 4px 48px rgba(0,0,0,.25);height:560px;overflow:hidden}
.bar{height:38px;border-bottom:1px solid rgba(128,128,128,.3);display:flex;align-items:center;gap:7px;padding:0 14px}
.bar i{width:10px;height:10px;border-radius:50%;background:rgba(19,19,19,.25)}
.bar span{margin-left:16px;flex:1;height:18px;border-radius:9px;background:rgba(57,57,57,.1)}
.page{padding:20px;display:flex;flex-direction:column;gap:12px}
.blk{border-radius:9px;background:rgba(57,57,57,.1);position:relative}
.hero{height:170px;background:rgba(19,19,19,.85)}
.hero:before{content:'';position:absolute;left:28px;top:44px;width:300px;height:22px;border-radius:4px;background:#fff}
.hero:after{content:'';position:absolute;left:28px;top:104px;width:120px;height:34px;border-radius:9px;background:#fff}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.three .blk{height:110px}
.form{height:120px;border:1.5px dashed rgba(128,128,128,.6);background:transparent;opacity:.6}
.callouts{display:flex;flex-direction:column;justify-content:space-around;padding:80px 0 60px;text-align:right}
.callouts p{font-size:15px;font-weight:700;position:relative}
.callouts p:after{content:'';position:absolute;right:-40px;top:9px;width:32px;height:1px;background:#131313}
.callouts small{display:block;font-weight:400;color:rgba(19,19,19,.62)}
.side{padding-top:40px}
.k{font-family:'Allerta Stencil';font-size:22px;color:rgba(19,19,19,.5)}
.side h2{font-size:30px;margin:8px 0 18px}
.price{font-size:40px;font-weight:700}
.term{font-size:17px;margin:6px 0 4px}
.note{font-size:15px;color:rgba(19,19,19,.62)}
.pill{display:inline-block;margin-top:28px;font-weight:700;font-size:16px;padding:14px 26px;border-radius:24px;border:1.5px solid rgba(128,128,128,.45)}
.steps{margin-top:40px;display:flex;gap:10px}.steps i{width:40px;height:3px;background:rgba(19,19,19,.2)}.steps i:first-child{background:#131313}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="top">
  <p class="crumb">Главная / Сайты</p>
  <h1>Сайты под ключ: что входит и сколько стоит</h1>
  <p class="lead">Листайте – сайт соберётся: лендинг, сайт компании, магазин</p>
</div>
<div class="row">
  <div class="callouts">
    <p>Первый экран<small>предложение и кнопка</small></p>
    <p>До 8 блоков<small>на выбор</small></p>
    <p>Форма заявки<small>в Telegram или на почту</small></p>
  </div>
  <div class="win">
    <div class="bar"><i></i><i></i><i></i><span></span></div>
    <div class="page">
      <div class="blk hero"></div>
      <div class="three"><div class="blk"></div><div class="blk"></div><div class="blk"></div></div>
      <div class="blk form"></div>
    </div>
  </div>
  <div class="side">
    <p class="k">01 / 03</p>
    <h2>Лендинг</h2>
    <p class="price">от 8 000 ₽</p>
    <p class="term">3–4 дня</p>
    <p class="note">Обычно 8 000–20 000 ₽ с опциями</p>
    <span class="pill">Узнать цену</span>
    <div class="steps"><i></i><i></i><i></i></div>
  </div>
</div>
</body></html>
