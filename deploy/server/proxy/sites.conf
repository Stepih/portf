# Сайты сервера – по строке на сайт: <адрес контейнера:порт>  <домены через пробел>
# Первый домен – основной: остальные с HTTPS перенаправляются на него, по нему же назван сертификат.
# Контейнер должен быть в сети web (см. compose.yml сайта). После правки: deploy/setup-server.ps1
# (или на сервере: docker compose -f /opt/proxy/compose.yml restart nginx).
# Сертификат – deploy/setup-server.ps1 -Cert <основной домен>, когда домен уже указывает на сервер.

portfolio:3000     showmyworks.ru www.showmyworks.ru 2.31.105.139.sslip.io

# 2.31.105.139.sslip.io – проверка до переезда DNS (http://2.31.105.139.sslip.io); после выпуска сертификата
# уводит на showmyworks.ru, тогда её можно убрать

# money: сайт и Strapi (админка, API, файлы). Домен впишите вместо example.ru – см. deploy/README.md
# money-next:3000    example.ru www.example.ru
# money-strapi:1337  cms.example.ru
